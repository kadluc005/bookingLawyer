<h1>Connexion</h1>
<form class="sheet panel detail" #form="ngForm" (ngSubmit)="enter()">
  <label>Adresse e-mail
    <input type="email" name="email" [(ngModel)]="email" required email autocomplete="username" />
  </label>
  <label>Mot de passe
    <input type="password" name="password" [(ngModel)]="password" required autocomplete="current-password" />
  </label>
  @if (error) { <p role="alert">{{ error }}</p> }
  <button [disabled]="form.invalid || busy">Se connecter</button>
  <p><a routerLink="/verification-email">Renvoyer le lien de confirmation avocat</a></p>
  <p><a routerLink="/inscription/client">Créer un compte client</a></p>
  <p><a routerLink="/inscription">Créer un compte avocat</a></p>
</form>
