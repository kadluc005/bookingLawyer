<header>
      <nav>
        <a class="brand" routerLink="/" aria-label="BookingLawyer, accueil"
          ><span class="mark" aria-hidden="true">§</span>BookingLawyer</a
        >
        <div class="navlinks">
          <a routerLink="/annuaire" routerLinkActive="active">Annuaire</a>
          @switch (session.account()?.role) {
            @case ('client') {
              <a routerLink="/client/profil" routerLinkActive="active">Mon profil</a>
            }
            @case ('lawyer') {
              <a routerLink="/espace" routerLinkActive="active">Mon dossier</a>
              <a routerLink="/inscription/profil" routerLinkActive="active">Mon profil</a>
              <a routerLink="/cotisation" routerLinkActive="active">Cotisation</a>
            }
            @case ('admin') {
              <a routerLink="/administration" routerLinkActive="active">Administration</a>
            }
            @default {
              <a routerLink="/connexion" routerLinkActive="active">Connexion</a>
              <a routerLink="/inscription/client">Inscription client</a>
              <a class="button" routerLink="/inscription">Inscription avocat</a>
            }
          }
          @if (session.account()) {
            <button class="secondary" type="button" (click)="signOut()">Se déconnecter</button>
          }
        </div>
      </nav>
    </header>
