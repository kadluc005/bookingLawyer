<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
  </head>
  <body style="margin:0;padding:0;background:#f2f5fa;font-family:Arial,Helvetica,sans-serif;color:#0b2c4c;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;">{{preheader}}</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#f2f5fa" style="background:#f2f5fa;">
      <tr>
        <td align="center" style="padding:32px 12px;">
          <!--[if mso]>
          <table role="presentation" width="600" align="center"><tr><td>
          <![endif]-->
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#ffffff" style="width:100%;max-width:600px;background:#ffffff;border:1px solid #dce5ef;border-radius:10px;">
            <tr>
              <td style="padding:20px 24px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td align="center" valign="middle" width="36" height="36" bgcolor="#142747" aria-hidden="true" style="width:36px;height:36px;background:#142747;color:#ffffff;border-radius:6px;font-size:23px;line-height:36px;font-weight:bold;">§</td>
                    <td valign="middle" style="padding-left:10px;color:#0b2c4c;font-size:21px;line-height:26px;font-weight:bold;">BookingLawyer</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td bgcolor="#08294a" style="padding:28px 24px;background:#08294a;color:#ffffff;">
                <h1 style="margin:0;color:#ffffff;font-size:29px;line-height:36px;font-weight:700;">{{title}}</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:26px 24px 0;color:#314d69;font-size:16px;line-height:25px;">
                {{{body}}}
              </td>
            </tr>
            <tr>
              <td style="padding:8px 24px 28px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td bgcolor="#08294a" style="background:#08294a;border-radius:6px;mso-padding-alt:12px 18px;">
                      <a href="{{actionUrl}}" style="display:inline-block;padding:12px 18px;border-radius:6px;color:#ffffff;font-size:15px;line-height:22px;font-weight:bold;text-decoration:none;mso-padding-alt:0;">{{actionLabel}}</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
          <!--[if mso]>
          </td></tr></table>
          <![endif]-->
        </td>
      </tr>
    </table>
  </body>
</html>
